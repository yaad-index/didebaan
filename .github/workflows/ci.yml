name: CI

# Runs on the pull request, on the push that lands it (a squash onto a base that
# has moved is a combination the pull request's run never covered), and as a
# reusable workflow that publish-image calls on the release tag before it
# builds, so the published image and a passing test run share a commit.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Track the version pinned in go.mod (currently Go 1.26) so CI and the
          # module stay in lockstep — single source of truth.
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pin the linter version so CI matches the local run (same reasoning as
          # go-version-file above); Dependabot bumps it deliberately.
          version: v2.11.4

      - name: Test
        # -race: the registry and adapters are exercised concurrently, so the
        # gate runs the race detector.
        run: go test -race ./...

  # On a release PR, the proposed version must be strictly greater than the
  # latest release tag. A stuck pin or a manifest out of sync with the tags
  # produces a release PR that looks normal and passes every other check.
  release-version:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check the release advances the version
        run: |
          proposed="$(jq -r '."."' .release-please-manifest.json)"
          # versionsort.suffix puts a pre-release below its own release.
          latest="$(git -c versionsort.suffix=- tag -l 'v*' --sort=-v:refname | head -1)"
          .github/scripts/check-release-advances.sh "$proposed" "${latest#v}"
