name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Prefer a PAT (RELEASE_PLEASE_TOKEN) over the built-in GITHUB_TOKEN.
          # Events made with GITHUB_TOKEN do not trigger further workflows
          # (GitHub's anti-recursion rule), which would suppress two things: the
          # release PR's CI would never run (so the required check would be
          # absent and the PR could not merge without an admin override), and
          # the release tag would not fire the image publish. A PAT acts as a
          # real account, so the release PR gets its CI run and the tag triggers
          # tag-gated workflows.
          #
          # The PAT is provisioned. The fallback stays as a guard against the
          # secret being absent, in which case the job runs degraded rather than
          # hard-failing on an empty token input, and the trade-off is exactly
          # the anti-recursion limit above.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          # Drive release-please from committed files rather than inline inputs:
          # the config file pins the release type and the pre-1.0 versioning
          # policy, and the manifest tracks the current version.
          #
          # bump-minor-pre-major governs BREAKING changes, not features: per
          # release-please's config schema it means "breaking changes only bump
          # semver minor if version < 1.0.0". So it is what stops a breaking
          # change jumping this repo to 1.0.0; a feat on a 0.x manifest bumps
          # the minor with or without it.
          #
          # Neither key produced the first release. That was a release-as pin,
          # removed once it had done its job and started forcing every later
          # release to the same version.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
