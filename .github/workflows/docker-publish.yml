name: publish-image

# Publish the container image to GHCR on every version tag. Tag-only by
# design: the release artifact is built from exactly the commit that was
# tagged, nothing else.
#
# NOTE: a tag created by the built-in GITHUB_TOKEN (e.g. release-please cutting
# a release) does NOT trigger the tag path — GitHub's anti-recursion rule. So
# there are two ways in: push a v* tag from a real account, OR run the workflow
# manually (workflow_dispatch). For a manual run, either pick the tag in the
# "Run workflow" ref dropdown, or pass the `tag` input to stamp the version;
# with neither, only `latest` is published.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to stamp/tag the image (e.g. v0.1.0). Leave empty to publish only :latest.'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  # The test suite on the commit being published. Nothing is published unless
  # it passes: the release tag is cut from a squash commit that the pull
  # request's run never covered.
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Built-in token; no extra secret needed thanks to packages: write.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/yaad-index/didebaan
          # On a tag push the version comes from the ref; on a manual run the
          # `tag` input overrides it (empty input falls back to the ref).
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
            # Don't move :latest onto a pre-release (e.g. v0.1.0-rc.1).
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') && !contains(inputs.tag, '-') }}

      # Build once without pushing and run the result, so an image whose binary
      # does not report the version it is tagged with is never published.
      # VERSION is the metadata step's own version output: the same string the
      # image is tagged with, not a second expression that has to agree with it.
      - name: Build for the version check
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: didebaan:version-check
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha

      - name: Check the image reports the version it is tagged with
        env:
          WANT: ${{ steps.meta.outputs.version }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          got="$(docker run --rm didebaan:version-check version)"
          if [ "$got" != "$WANT" ]; then
            echo "the built binary reports '$got', the image is tagged '$WANT'"
            exit 1
          fi
          if ! grep -qxF "ghcr.io/yaad-index/didebaan:$WANT" <<<"$TAGS"; then
            echo "no pushed tag carries $WANT; tags are:"
            echo "$TAGS"
            exit 1
          fi
          echo "binary reports $got, matching the image tag"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
